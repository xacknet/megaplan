{% extends "core/base.html" %}
{% load bootstrap5 %}

{% block title %}{{ title }} - AgroExpert{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h2 class="card-title">{{ title }}</h2>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {% bootstrap_form form %}
                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">
                        {% if operation %}Save Changes{% else %}Create Operation{% endif %}
                    </button>
                    <a href="{% url 'field_detail' field.pk %}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
